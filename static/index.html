<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dyson Concierge - Maya</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg viewBox="0 0 100 30" xmlns="http://www.w3.org/2000/svg" width="100" height="30">
                    <text x="0" y="22" font-family="'Arial Black', sans-serif" font-size="24" fill="#ffffff">dyson</text>
                </svg>
            </div>
            <h1>Dyson AI Concierge</h1>
            <p>Speak naturally with Maya to explore products or get support.</p>
        </header>

        <main class="interaction-area">
            <div class="status-indicator">
                <div class="ring" id="activity-ring"></div>
                <div class="bot-avatar">
                    <img src="https://ui-avatars.com/api/?name=Maya&background=101010&color=fff&size=100" alt="Maya" />
                </div>
            </div>
            
            <div class="controls">
                <button id="connect-btn" class="primary-btn">
                    <span class="icon">🎤</span>
                    Tap to Speak
                </button>
                <div id="status-text" class="status-text">Ready to connect...</div>
            </div>
        </main>

        <footer>
            <p>Powered by Pipecat AI & ElevenLabs</p>
        </footer>
    </div>

    <!-- Hidden audio element for WebRTC Remote Stream -->
    <audio id="remote-audio" autoplay></audio>

    <script src="/static/app.js"></script>
</body>
</html>
